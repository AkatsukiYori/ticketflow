services:
  react_app:
    build: ./backend
    container_name: ticketflow_react_app
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    depends_on:
      - react_db
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    command: >
      sh -c "
      sleep 5 &&
      pnpm prisma generate &&
      pnpm prisma migrate deploy &&
      pnpm dev
      "
    networks:
      - ticket-network

  react_frontend:
    build: ./frontend
    container_name: ticketflow_react_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - react_app
    networks:
      - ticket-network

  react_db:
    image: postgres:16
    container_name: ticketflow_react_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: akatsukiyori
      POSTGRES_PASSWORD: "yori!@#"
      POSTGRES_DB: ticketflow
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - ticket-network

volumes:
  pg_data:

networks:
  ticket-network:
    driver: bridge